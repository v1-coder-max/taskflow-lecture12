<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks — TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">✅ TaskFlow</div>
    <div class="user-box">
      <div class="avatar" id="user-avatar">?</div>
      <div class="user-meta">
        <strong id="user-name">Loading...</strong>
        <span id="user-email"></span>
      </div>
      <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h2 id="greeting">My Tasks</h2>
      <p>Only you can see the tasks on this page.</p>
    </div>

    <!-- Stats -->
    <section class="stats">
      <div class="stat total"><div class="num" id="stat-total">0</div><div class="label">Total</div></div>
      <div class="stat pending"><div class="num" id="stat-pending">0</div><div class="label">Pending</div></div>
      <div class="stat progress"><div class="num" id="stat-progress">0</div><div class="label">In progress</div></div>
      <div class="stat done"><div class="num" id="stat-done">0</div><div class="label">Done</div></div>
      <div class="stat overdue"><div class="num" id="stat-overdue">0</div><div class="label">Overdue</div></div>
    </section>

    <div class="grid">
      <!-- Create task -->
      <aside class="card sticky">
        <h3>➕ New task</h3>
        <form id="create-form" novalidate>
          <div class="field">
            <label for="create-title">Title *</label>
            <input id="create-title" name="title" type="text" maxlength="200" placeholder="What needs to be done?">
            <div class="field-error" data-error-for="title"></div>
          </div>
          <div class="field">
            <label for="create-description">Description</label>
            <textarea id="create-description" name="description" maxlength="2000" placeholder="Optional details"></textarea>
            <div class="field-error" data-error-for="description"></div>
          </div>
          <div class="row-2">
            <div class="field">
              <label for="create-priority">Priority</label>
              <select id="create-priority" name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="field">
              <label for="create-dueDate">Due date</label>
              <input id="create-dueDate" name="dueDate" type="date">
              <div class="field-error" data-error-for="dueDate"></div>
            </div>
          </div>
          <button id="create-btn" type="submit" class="btn btn-primary btn-block">Add task</button>
        </form>
      </aside>

      <!-- Task list -->
      <section class="card">
        <div class="toolbar">
          <input id="filter-search" type="search" placeholder="🔍 Search title or description">
          <select id="filter-status">
            <option value="">All status</option>
            <option value="pending">Pending</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
          <select id="filter-priority">
            <option value="">All priority</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <select id="filter-sort">
            <option value="createdAt:desc">Newest first</option>
            <option value="createdAt:asc">Oldest first</option>
            <option value="dueDate:asc">Due date</option>
            <option value="priority:desc">Priority (high first)</option>
            <option value="title:asc">Title A–Z</option>
          </select>
        </div>

        <div id="task-list" class="task-list"><div class="loading">Loading tasks...</div></div>

        <div id="pagination" class="pagination hidden">
          <span id="page-info"></span>
          <div class="btns">
            <button id="prev-btn" class="btn btn-ghost btn-sm">← Prev</button>
            <button id="next-btn" class="btn btn-ghost btn-sm">Next →</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Edit modal -->
  <div id="edit-modal" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-heading">
      <h3 id="edit-heading">✏️ Edit task</h3>
      <form id="edit-form" novalidate>
        <div class="field">
          <label for="edit-title">Title *</label>
          <input id="edit-title" name="title" type="text" maxlength="200">
          <div class="field-error" data-error-for="title"></div>
        </div>
        <div class="field">
          <label for="edit-description">Description</label>
          <textarea id="edit-description" name="description" maxlength="2000"></textarea>
          <div class="field-error" data-error-for="description"></div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="edit-status">Status</label>
            <select id="edit-status" name="status">
              <option value="pending">Pending</option>
              <option value="in_progress">In progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="field">
            <label for="edit-priority">Priority</label>
            <select id="edit-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="edit-dueDate">Due date</label>
          <input id="edit-dueDate" name="dueDate" type="date">
          <div class="field-error" data-error-for="dueDate"></div>
        </div>
        <div class="modal-actions">
          <button type="button" id="edit-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="edit-save" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
