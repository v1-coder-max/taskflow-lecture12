<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="brand">✅ TaskFlow</div>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to manage your tasks</p>

      <div id="form-alert" class="alert hidden"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <div class="field-error" data-error-for="email"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
            <button type="button" class="pw-toggle">Show</button>
          </div>
          <div class="field-error" data-error-for="password"></div>
        </div>
        <button id="submit-btn" type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="/register.html">Create one</a></p>
    </div>
  </main>
  <div id="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
