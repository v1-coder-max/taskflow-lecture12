<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — TaskFlow</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="brand">✅ TaskFlow</div>
      <h1>Create your account</h1>
      <p class="subtitle">Start organising your work in seconds</p>

      <div id="form-alert" class="alert hidden"></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Vishal Sharma" required>
          <div class="field-error" data-error-for="name"></div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <div class="field-error" data-error-for="email"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Min 8 characters" required>
            <button type="button" class="pw-toggle">Show</button>
          </div>
          <div class="hint">At least 8 characters, with a letter and a number.</div>
          <div class="field-error" data-error-for="password"></div>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat password" required>
          <div class="field-error" data-error-for="confirmPassword"></div>
        </div>
        <button id="submit-btn" type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </main>
  <div id="toast"></div>
  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
